[workspace]
members = ["crates/precision", "crates/precision-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.126"
